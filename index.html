#sl{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;overflow:hidden}

#nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}
#panel{background:var(--c);border-radius:8px;padding:14px;margin-top:6px;box-shadow:0 1px 5px #0002}
#panel:empty{display:none}h3{margin:0 0 8px}h3 small{color:#666;font-weight:400}
.it{border-bottom:1px solid #eee;padding:6px 0}.it p{margin:2px 0}.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}
.bar{position:relative;background:#eee;border-radius:4px;margin:5px 0;padding:5px 8px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#ffc00099}.bar span,.bar b{position:relative}.bar b{float:right}
#cl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;padding:10px}
table{border-collapse:collapse;width:100%}td{border-bottom:1px solid #eee;padding:5px}td:last-child{text-align:right;font-weight:600}
.tx{background:#f7f7f7;border-left:4px solid var(--g);padding:6px 10px;margin:6px 0;font-size:14px}
.big{font-size:34px;font-weight:700}

 [{py:'Se llama calcular_promedio([]) sin validar antes. ¿Qué ocurre?',cs:'En CalcularPromedio, suma es int (31) y hay 2 notas; se escribe double promedio = suma / notas.Length;. ¿Qué valor queda?'},0,{py:['Error ZeroDivisionError','Devuelve 0','Devuelve None','Devuelve []'],cs:['15','15.5','16','Error de compilación']}],
 [{py:'main.py llama calcular_promedio(15, 17, 12) con tres números sueltos. ¿Qué falla?',cs:'Program.cs llama Calculos.CalcularPromedio(15, 17, 12) con tres números. ¿Qué falla?'},0,{py:['Pasa tres argumentos; la función espera una lista','Falta importar math','La función debe ser privada','Falta crear calculos.py'],cs:['La firma espera un arreglo; hay tres argumentos','Falta using System.Math','El método debe ser privado','Falta crear Calculos.cs']}]]},

8:[['Entrada/salida y principal',10],['Funciones de cálculo',7],['Condición académica',10],['Entrada/salida y principal',10]],

31:[['Condición y umbral',20],['Condición y umbral',20],['Validación antes de calcular',{py:13,cs:17}],['Tabla de pruebas y casos límite',31],['Validación antes de calcular',{py:13,cs:17}]],
21:[['Orden de las llamadas',21]],
22:[['Operadores y tipos',22],['Funciones que no retornan',5],['Variables locales',5]],

38:[['Reutilización de funciones',34],['Validación antes de calcular',{py:13,cs:17}]]};
const db=firebase.database(),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pk=(x,l)=>x&&typeof x==='object'&&!Array.isArray(x)?x[l]:x;
const V=x=>x&&typeof x==='object'&&!Array.isArray(x)?(me.len?x[me.len]:'[Py] '+x.py+' · [C#] '+x.cs):x;
const nm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f"'`]/g,'').replace(/\s+/g,' ').trim();
const okp=(r,c)=>String(c).split('|').some(x=>nm(x)===nm(r));
const isOk=(a,it,k,m)=>a.t==='pred'?okp(m.a[k],pk(it[1],m.l)):m.a[k]==pk(it[1],m.l);
let lastN=-1,got=0,S={i:0,libre:false,pub:false,act:{},rev:{},mostrar:{}},me,ref,R={},NB={},sig='';
try{const z=JSON.parse(localStorage.t6||'{}');['sala','cod','nom','gr','len'].forEach(k=>z[k]&&($(k).value=z[k]))}catch(e){}
async function enter(d){
 const g=k=>$(k).value.trim(),sala=g('sala').toLowerCase().replace(/[^a-z0-9_-]/g,'');
 if(!sala)return alert('Escribe el código de sala');
 me={d,len:d?'':$('len').value,sala,cod:g('cod').replace(/[.#$\/\[\]\s]/g,''),nom:g('nom'),gr:g('gr')||'—',li:null};
 if(!d&&(!me.cod||!me.nom))return alert('Completa código y nombre');
 try{localStorage.t6=JSON.stringify({sala,cod:g('cod'),nom:g('nom'),gr:g('gr'),len:$('len').value})}catch(e){}
 ref=db.ref('salas/'+sala);
 if(d){const k=prompt('Clave docente:');if(k===null)return;const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(k)))].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(h!==PH)return alert('Clave docente incorrecta')}
 $('lg').hidden=true;$('app').hidden=false;$('who').innerHTML=d?'Docente · sala '+esc(sala):esc(me.nom)+' · '+esc(me.gr)+' · '+(me.len==='cs'?'C#':'Python');
 const fail=m=>{$('nav').innerHTML='<span class="no">'+m+'</span>'};
 $('nav').textContent='Conectando…';setTimeout(()=>{if(!got)fail('Sin conexión con la base de datos. Revisa la dirección de Firebase y las reglas.')},8000);
 ref.child('estado').on('value',s=>{got=1;const v=s.val()||{},pi=S.i;
  S={i:0,libre:false,pub:false,...v,act:v.act||{},rev:v.rev||{},mostrar:v.mostrar||{}};
  if(S.i!==pi||(!S.libre&&!S.pub))me.li=null;draw()},e=>fail('Firebase rechazó el acceso ('+e.code+'). Revisa las reglas de la base de datos.'));
 ref.child('resp').on('value',s=>{R=s.val()||{};panel()});
 ref.child('nube').on('value',s=>{NB=s.val()||{};panel()});
 if(d)document.onkeydown=e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')go(S.i+1);if(e.key==='ArrowLeft')go(S.i-1)};
}
const cur=()=>me.li!=null?me.li:S.i;
function go(n){n=Math.max(0,Math.min(NS-1,n));if(me.d)ref.child('estado/i').set(n);else if(S.libre){me.li=n;draw()}}
function rv(n){me.li=n-1;draw()}
function back(){me.li=null;draw()}
function tg(p,n){ref.child('estado/'+p+'/'+n).set(S[p][n]?null:true)}
function tf(p){ref.child('estado/'+p).set(S[p]?null:true)}
function hidden(n){return SC.includes(n)&&S.act[n]&&!S.mostrar[n]}
function draw(){
 const n=cur()+1;
 $('sl').innerHTML=hidden(n)?'<div style="padding:20px"><h2 style="color:var(--g)">Actividad en curso</h2><p>'+(me.d?'La diapositiva está oculta. Pulsa «Mostrar diapositiva» para proyectarla.':'La diapositiva está oculta mientras respondes. Resuelve en el panel de abajo.')+'</p></div>':`<img src="slides/s${n}.webp" alt="Diapositiva ${n}">`;
 if(n<NS)new Image().src=`slides/s${n+1}.webp`;
 let h='';
 if(me.d)h=`<button onclick="go(S.i-1)">◀</button><b>${n} / ${NS}</b><button onclick="go(S.i+1)">▶</button> <input type="number" min="1" max="${NS}" placeholder="Ir a…" style="width:90px;margin:0" onchange="go(this.value-1)"> <button class="${S.libre?'on':'s'}" onclick="tf('libre')">Modo libre</button> <button class="s" onclick="csv()">Exportar CSV</button>`;
 else{h=`<b>${n} / ${NS}</b>`;if(S.libre||me.li!=null)h=`<button onclick="go(${cur()-1})" ${S.libre?'':'hidden'}>◀</button>`+h+`<button onclick="go(${cur()+1})" ${S.libre?'':'hidden'}>▶</button>`;
  if(me.li!=null&&S.pub)h+=` <button class="s" onclick="back()">Volver a mis resultados</button>`;
  if(S.libre)h+=' <small>Modo libre: avanza a tu ritmo</small>'}
 $('nav').innerHTML=h;if(n!==lastN){sig='';lastN=n}panel();
}
const ord=(len,seed)=>{let a=[...Array(len).keys()],h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
 for(let i=len-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function panel(){
 if(!me||!ref)return;const n=cur()+1,a=ACT[n],el=$('panel');
 if(me.d){el.innerHTML=ctl(n,a);return}
 const mine=(R[n]||{})[me.cod],s=[n,S.act[n],S.rev[n],S.pub,!!mine,n===LAST?JSON.stringify(R).length:0,!!Object.keys(NB).length].join('|');
 if(s===sig){const w=$('cw');if(w&&a&&a.t==='nube')w.innerHTML=cloud();return}
 sig=s;el.innerHTML=stu(n,a,mine);
}
function ctl(n,a){
 let h='';
 if(a){h+=`<h3>${esc(a.h)}</h3><button class="${S.act[n]?'on':''}" onclick="tg('act',${n})">${S.act[n]?'Cerrar actividad':'Abrir actividad'}</button>`;
  if(a.t!=='nube')h+=`<button class="${S.rev[n]?'on':'s'}" onclick="tg('rev',${n})">${S.rev[n]?'Ocultar solución':'Revelar solución'}</button>`;
  if(SC.includes(n))h+=`<button class="${S.mostrar[n]?'on':'s'}" onclick="tg('mostrar',${n})">${S.mostrar[n]?'Diapositiva visible':'Mostrar diapositiva'}</button>`;
  if(a.t==='vot')h+=votBars(n,a);
  if(a.t==='sel'||a.t==='pred'){const r=Object.values(R[n]||{});h+=`<p><b>${r.length}</b> respuestas (Python ${r.filter(x=>x.l==='py').length} · C# ${r.filter(x=>x.l==='cs').length}) · porcentaje de acierto por ítem:</p>`;
   a.i.forEach((it,k)=>{const ok=r.filter(x=>x.a&&isOk(a,it,k,x)).length,p=r.length?Math.round(ok/r.length*100):0;
    h+=`<div class="bar"><i style="width:${p}%"></i><span>${k+1}. ${esc(V(it[0]))}</span><b>${p}%</b></div>`});
   if(a.j){h+='<h3>Justificaciones</h3>';r.filter(x=>x.j).forEach(x=>h+=`<div class="tx"><b>${esc(x.nom)}</b> (${esc(x.gr)}): ${esc(x.j)}</div>`)}}
  if(a.t==='nube')h+=cloud();
  if(a.t==='txt'){const r=Object.values(R[n]||{}),gs={};r.forEach(x=>(gs[x.gr]=gs[x.gr]||[]).push(x));h+=`<p><b>${r.length}</b> respuestas</p>`;
   Object.keys(gs).sort().forEach(g=>{h+=`<h3>Grupo ${esc(g)}</h3>`;gs[g].forEach(x=>{h+=`<div class="tx"><b>${esc(x.nom)}</b><br>`+a.f.map((f,k)=>`<i>${esc(f)}:</i> ${esc((x.x||[])[k]||'')}`).join('<br>')+'</div>'})})}}
 if(n===LAST)h+=`<h3>Cierre</h3><p>Publica los resultados cuando termines de revelar todas las soluciones.</p><button class="${S.pub?'on':''}" onclick="tf('pub')">${S.pub?'Resultados publicados':'Publicar resultados'}</button> <button class="s" onclick="csv()">Exportar CSV</button>`+dash(1);
 return h;
}
function votBars(n,a){const r=Object.values(R[n]||{}),t=r.length;return `<p><b>${t}</b> votos</p>`+a.o.map((o,x)=>{const c=r.filter(y=>y.v===x).length,p=t?Math.round(c/t*100):0;return `<div class="bar"><i style="width:${p}%"></i><span>${esc(o)}</span><b>${c} (${p}%)</b></div>`}).join('')}
function cloud(){const c={};Object.values(NB).forEach(w=>{const k=String(w).toLowerCase();c[k]=(c[k]||0)+1});
 const m=Math.max(1,...Object.values(c));return '<div id="cl">'+Object.entries(c).map(([w,v])=>`<span style="font-size:${14+v/m*30}px;font-weight:${v>1?700:500}">${esc(w)}</span>`).join('')+'</div>'}
function stu(n,a,mine){
 if(n===LAST){if(!S.pub)return '<p>Los resultados se publicarán al final de la sesión.</p>';return resultados()}
 if(!a)return '';
 if(a.t==='nube'){if(!S.act[n]&&!Object.keys(NB).length)return '<p>La nube se abrirá cuando el docente active la actividad.</p>';
  return `<h3>${esc(a.h)}</h3>`+(S.act[n]&&!me.nb?'<input id="w0" maxlength="30" placeholder="Palabra 1"><input id="w1" maxlength="30" placeholder="Palabra 2 (opcional)"><input id="w2" maxlength="30" placeholder="Palabra 3 (opcional)"><button onclick="sendNube()">Enviar palabras</button>':'<p>'+(me.nb?'Enviado ✓':'Actividad cerrada')+'</p>')+'<div id="cw">'+cloud()+'</div>'}
 if(!S.act[n]&&!mine)return `<h3>${esc(a.h)}</h3><p>Actividad cerrada. Espera la indicación del docente.</p>`;
 if(a.t==='vot'){let h=`<h3>${esc(a.h)}</h3>`;if(mine)h+=`<p>Votaste: <b>${esc(a.o[mine.v])}</b> ✓</p>`;else h+=a.o.map((o,x)=>`<button class="s" onclick="put(${n},{v:${x}})">${esc(o)}</button>`).join('<br>');return h+(S.rev[n]?votBars(n,a):'')}
 if(a.t==='txt'){let h=`<h3>${esc(a.h)}</h3>`;if(mine)return h+'<p>Enviado ✓</p>'+a.f.map((f,k)=>`<div class="tx"><i>${esc(f)}:</i> ${esc((mine.x||[])[k]||'')}</div>`).join('');
  a.f.forEach((f,k)=>h+=`<label>${esc(f)}</label><textarea id="x${k}" rows="2"></textarea>`);return h+`<button onclick="sendTxt(${n})">Enviar</button>`}
 let h=`<h3>${esc(a.h)} <small>${a.p} pts</small></h3>`;
 a.i.forEach((it,k)=>{const o=pk(it[2],me.len)||a.o||[],od=a.sh?ord(o.length,me.cod+n+k):o.map((_,x)=>x);h+=`<div class="it"><p>${k+1}. ${esc(V(it[0]))}</p>`;
  if(mine){const ok=isOk(a,it,k,mine),c=a.t==='pred'?String(pk(it[1],mine.l)).split('|')[0]:o[pk(it[1],mine.l)];h+=`<p class="${S.rev[n]?(ok?'ok':'no'):''}">Tu respuesta: ${esc(a.t==='pred'?mine.a[k]:o[mine.a[k]])}${S.rev[n]?(ok?' ✓':' ✗ · Correcta: '+esc(c)):''}</p>`}
  else if(a.t==='pred')h+=`<input id="q${k}" autocomplete="off" placeholder="Tu respuesta">`;
  else h+=`<select id="q${k}"><option value="">Elige…</option>${od.map(x=>`<option value="${x}">${esc(o[x])}</option>`).join('')}</select>`;h+='</div>'});
 if(mine)return h+`<p>Enviado ✓ ${S.rev[n]?`· Puntaje: <b>${mine.s}/${a.p}</b>`:'· El puntaje se mostrará cuando el docente revele la solución.'}</p>`;
 if(a.j)h+=`<p>${esc(a.j)}</p><textarea id="jj" rows="3"></textarea>`;
 return h+`<button onclick="sendSel(${n})">Enviar respuestas</button>`;
}
async function put(n,v){if(!S.act[n])return alert('La actividad está cerrada');
 const r=ref.child('resp/'+n+'/'+me.cod);if((await r.once('value')).val())return alert('Ya enviaste esta actividad');
 await r.set({nom:me.nom,gr:me.gr,l:me.len,t:Date.now(),...v})}
function sendSel(n){const a=ACT[n],ans=[];for(let k=0;k<a.i.length;k++){const v=$('q'+k).value.trim();if(v==='')return alert('Responde todos los ítems');ans.push(a.t==='pred'?v:+v)}
 const mm={a:ans,l:me.len},ok=a.i.filter((it,k)=>isOk(a,it,k,mm)).length;
 put(n,{a:ans,j:a.j?$('jj').value:'',s:Math.round(ok/a.i.length*a.p*100)/100})}
function sendTxt(n){const a=ACT[n],x=a.f.map((f,k)=>$('x'+k).value.trim());if(!x.some(v=>v))return alert('Escribe tu respuesta');put(n,{x})}
function sendNube(){const w=[0,1,2].map(k=>$('w'+k).value.trim()).filter(Boolean);if(!w.length)return alert('Escribe al menos una palabra');
 w.forEach(x=>ref.child('nube').push(x));me.nb=1;sig='';panel()}
function totals(){const st={};SC.forEach(n=>Object.entries(R[n]||{}).forEach(([c,m])=>{const o=st[c]=st[c]||{nom:m.nom,gr:m.gr,l:m.l,s:{},tot:0};o.s[n]=m.s;o.tot+=m.s}));return st}
function dash(t){
 const st=Object.values(totals()),N=st.length,r1=v=>Math.round(v*10)/10;
 if(!N)return '<h3 style="margin-top:14px">Resultados del salón</h3><p>Aún no hay respuestas con puntaje.</p>';
 const tt=st.map(x=>x.tot),avg=tt.reduce((a,b)=>a+b,0)/N,bar=(l,p,x)=>`<div class="bar"><i style="width:${p}%"></i><span>${l}</span><b>${x}</b></div>`;
 let h=`<h3 style="margin-top:14px">Resultados del salón</h3><p><b>${N}</b> participantes · promedio <b>${avg.toFixed(1)}</b>/100 · máximo <b>${r1(Math.max(...tt))}</b> · mínimo <b>${r1(Math.min(...tt))}</b></p>`;
 let rk=0,pv=null,c=0,rows='';
 [...st].sort((a,b)=>b.tot-a.tot).forEach((x,i)=>{if(x.tot!==pv){rk=i+1;pv=x.tot}if(rk<=5&&c++<8)rows+=`<tr><td>${rk}.º ${esc(x.nom)} <small>(${esc(x.gr)} · ${x.l==='cs'?'C#':'Python'})</small></td><td>${r1(x.tot)}</td></tr>`});
 h+=`<h3>Top 5</h3><table>${rows}</table>`+(t?'<small>Python y C# tienen ejercicios distintos en las diap. 22, 27 y 37: los puntajes no son del todo comparables. Los empates comparten puesto.</small>':'');
 const b=[0,0,0,0,0];tt.forEach(v=>b[Math.min(4,Math.floor(v/20))]++);
 h+='<h3 style="margin-top:12px">Distribución de puntajes</h3>'+b.map((n,i)=>bar(`${i*20}–${i*20+20}`,n/N*100,n)).join('');
 h+='<h3 style="margin-top:12px">Acierto promedio por actividad</h3>'+SC.map(n=>{const a=ACT[n],r=Object.values(R[n]||{}),p=r.length?r.reduce((x,y)=>x+y.s,0)/(r.length*a.p)*100:0;return bar(`Diap. ${n} · ${esc(a.h.slice(0,48))} <small>(${r.length} resp.)</small>`,p,Math.round(p)+'%')}).join('');
 const grp=(k,f)=>{const m={};st.forEach(x=>{const g=f(x);(m[g]=m[g]||[]).push(x.tot)});return Object.keys(m).sort().map(g=>`<tr><td>${esc(g)} <small>(${m[g].length})</small></td><td>${(m[g].reduce((a,b)=>a+b,0)/m[g].length).toFixed(1)}</td></tr>`).join('')};
 return h+`<h3 style="margin-top:12px">Promedio por grupo</h3><table>${grp(0,x=>x.gr)}</table><h3 style="margin-top:12px">Promedio por lenguaje</h3><table>${grp(0,x=>x.l==='cs'?'C#':'Python')}</table>`;
}
function resultados(){
 let tot=0,rows='';const rep=new Map();
 SC.forEach(n=>{const a=ACT[n],m=(R[n]||{})[me.cod];
  if(!m){rows+=`<tr><td>Diap. ${n} · ${esc(a.h)}</td><td>—</td></tr>`;return}
  tot+=m.s;rows+=`<tr><td>Diap. ${n} · ${esc(a.h)}</td><td>${m.s}/${a.p}</td></tr>`;
  a.i.forEach((it,k)=>{if(!isOk(a,it,k,m)){const t=T[n].length>1?T[n][k]:T[n][0];rep.set(t[0],pk(t[1],me.len))}})});
 const g=Object.values(totals()).filter(x=>x.gr===me.gr),avg=g.length?g.reduce((p,x)=>p+x.tot,0)/g.length:0;
 let h=`<h3>Tus resultados</h3><p class="big">${Math.round(tot*10)/10} / 100</p><p>Promedio de tu grupo (${esc(me.gr)}, ${g.length} participantes): <b>${avg.toFixed(1)}</b></p><table>${rows}</table><h3 style="margin-top:14px">Para repasar</h3>`;
 if(!rep.size)return h+'<p class="ok">¡Felicitaciones! Acertaste todos los ítems con puntaje.</p>'+dash();
 return h+[...rep].map(([t,s])=>`<p>${esc(t)} <button class="s" onclick="rv(${s})">Ver diapositiva ${s}</button></p>`).join('')+dash();
}
function csv(){
 const st=totals(),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',ex=Object.keys(ACT).filter(n=>ACT[n].t==='txt'||ACT[n].j).map(Number);
 const jx={};ex.forEach(n=>Object.entries(R[n]||{}).forEach(([c,m])=>{(st[c]=st[c]||{nom:m.nom,gr:m.gr,l:m.l,s:{},tot:0});(jx[c]=jx[c]||{})[n]=ACT[n].t==='txt'?(m.x||[]).join(' | '):m.j}));
 let r=[['codigo','nombre','grupo','lenguaje',...SC.map(n=>'Diap'+n+' ('+ACT[n].p+')'),'total',...ex.map(n=>'Texto Diap'+n)]];
 Object.entries(st).sort((a,b)=>a[1].gr.localeCompare(b[1].gr)||a[1].nom.localeCompare(b[1].nom)).forEach(([c,o])=>r.push([c,o.nom,o.gr,o.l||'',...SC.map(n=>o.s[n]??''),o.tot,...ex.map(n=>(jx[c]||{})[n]||'')]));
 const b=new Blob(['\ufeff'+r.map(x=>x.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),l=document.createElement('a');
 l.href=URL.createObjectURL(b);l.download='tema6_'+me.sala+'.csv';l.click();
}
